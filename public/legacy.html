<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to Daigaku Karate Kai London</title>
<script>
(function () {
  var map = {
    "books.html": "/books",
    "club-shihan.html": "/shihan",
    "contact.html": "/contact",
    "courses.html": "/training",
    "dkk-fighters.html": "/fighters",
    "faqs.html": "/training",
    "four-shades-of-black.html": "/books",
    "gallery.html": "/gallery",
    "goju-ryu.html": "/goju-ryu",
    "gradings.html": "/training",
    "history.html": "/history",
    "links.html": "/links",
    "training.html": "/training",
    "waking-dragons-2.html": "/books",
    "yudansha.html": "/yudansha"
  };
  // The legacy site links to these two ways round: a real query string
  // (/index.php?page=X) and the "?" percent-encoded into the path
  // (/index.php%3Fpage%3DX). Production decodes the second into a literal "?"
  // inside the path, so read the whole decoded URL rather than just .search.
  var raw = window.location.href;
  try { raw = decodeURIComponent(raw); } catch (e) {}
  var m = /[?&]page=([^&#]+)/.exec(raw);
  var key = m ? m[1].toLowerCase() : "";
  var dest = map[key] || "/";

  // Every /index.php?page=X variant serves this same static file, so without
  // a canonical Google sees a dozen-plus byte-identical pages and cannot tell
  // which one is authoritative ("Duplicate without user-selected canonical"
  // in Search Console). Set it per-destination before the redirect fires so a
  // crawl that renders JS but does not follow the redirect still gets a clear
  // signal for THIS specific legacy URL.
  var link = document.createElement("link");
  link.rel = "canonical";
  link.href = "https://goju-karate.co.uk" + dest;
  document.head.appendChild(link);

  window.location.replace(dest);
})();
</script>
<style>
  body { background:#0f0e0c; color:#e8e3d9; font-family:system-ui,-apple-system,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px; }
  .box { max-width:34rem; text-align:center; }
  h1 { font-size:1.25rem; font-weight:600; margin:0 0 .75rem; }
  p { color:#9a9287; line-height:1.6; margin:0 0 1.25rem; }
  nav { display:flex; flex-wrap:wrap; gap:.5rem 1.25rem; justify-content:center; }
  a { color:#c9a96e; }
</style>
</head>
<body>
<div class="box">
  <h1>Daigaku Karate Kai London</h1>
  <p>This page has moved. Taking you to the new site.</p>
  <nav>
    <a href="/">Home</a>
    <a href="/training">Training</a>
    <a href="/shihan">Shihan</a>
    <a href="/yudansha">Yudansha</a>
    <a href="/gallery">Gallery</a>
    <a href="/contact">Contact</a>
  </nav>
</div>
</body>
</html>
